<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#110f17">
<title>Snippy</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Opening animation (the same as the desktop app's) -->
  <div id="splash" class="splash">
    <div class="splash-glow"></div>
    <div class="splash-logo"><svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A372F8"/>
            <stop offset=".55" stop-color="#D446EE"/>
            <stop offset="1" stop-color="#F06BBE"/>
          </linearGradient>
          <radialGradient id="shine" cx=".3" cy=".2" r=".6">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b3150"/>
            <stop offset=".5" stop-color="#1c1430"/>
            <stop offset="1" stop-color="#160f26"/>
          </linearGradient>
        </defs>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#tile)"/>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#shine)"/>
        <!-- Blade with the lower point: the top ring's half. -->
        <g class="blade-a">
          <circle cx="245" cy="352" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M300 392 L492 520" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 520 L600 508 L852 635 L505 588 Z" fill="url(#steel)"/>
        </g>
        <!-- Blade with the upper point (and the eye): the bottom ring's half. -->
        <g class="blade-b">
          <circle cx="240" cy="665" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M298 628 L492 510" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 448 L848 318 L600 508 L470 540 Z" fill="url(#steel)"/>
          <g class="eye">
            <circle cx="592" cy="452" r="33" fill="#fff"/>
            <circle cx="600" cy="450" r="14" fill="#160f26"/>
          </g>
        </g>
        <circle cx="480" cy="515" r="24" fill="#E36BE4"/>
      </svg></div>
    <div class="splash-name">Snippy</div>
  </div>

  <!-- ===== Home ===== -->
  <section id="home" class="screen home" hidden>
    <header class="home-head">
      <div class="brand"><svg class="logo-svg" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A372F8"/>
            <stop offset=".55" stop-color="#D446EE"/>
            <stop offset="1" stop-color="#F06BBE"/>
          </linearGradient>
          <radialGradient id="shine" cx=".3" cy=".2" r=".6">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b3150"/>
            <stop offset=".5" stop-color="#1c1430"/>
            <stop offset="1" stop-color="#160f26"/>
          </linearGradient>
        </defs>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#tile)"/>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#shine)"/>
        <!-- Blade with the lower point: the top ring's half. -->
        <g class="blade-a">
          <circle cx="245" cy="352" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M300 392 L492 520" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 520 L600 508 L852 635 L505 588 Z" fill="url(#steel)"/>
        </g>
        <!-- Blade with the upper point (and the eye): the bottom ring's half. -->
        <g class="blade-b">
          <circle cx="240" cy="665" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M298 628 L492 510" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 448 L848 318 L600 508 L470 540 Z" fill="url(#steel)"/>
          <g class="eye">
            <circle cx="592" cy="452" r="33" fill="#fff"/>
            <circle cx="600" cy="450" r="14" fill="#160f26"/>
          </g>
        </g>
        <circle cx="480" cy="515" r="24" fill="#E36BE4"/>
      </svg><span>Snippy</span></div>
      <span id="version" class="version"></span>
    </header>
    <div class="home-scroll">
      <div class="hero">
        <h1>Make a video</h1>
        <p>Pick a shape, then add your videos and photos.</p>
        <div class="aspect-row" id="aspectRow"></div>
      </div>
      <button id="homeAutoCut" class="autocut-card">
        <span class="ac-icon"><i data-icon="wand"></i></span>
        <span><b>AutoCut</b><small>Pick some clips and a song. Snippy cuts them to the beat for you.</small></span>
      </button>
      <h2 class="section-title">Your projects</h2>
      <div id="projects" class="projects"></div>
      <p id="noProjects" class="empty" hidden>Nothing here yet. Your projects save by themselves as you edit.</p>
    </div>
  </section>

  <!-- ===== Editor ===== -->
  <section id="editor" class="screen editor" hidden>
    <header class="ed-top">
      <button id="edBack" class="icon-btn" aria-label="Back to your projects"><i data-icon="back"></i></button>
      <button id="edName" class="ed-name"></button>
      <button id="edAspect" class="chip-btn" aria-label="Shape and background"></button>
      <button id="edExport" class="export-btn">Export</button>
    </header>
    <div class="stage-wrap">
      <div id="stage" class="stage"></div>
      <div id="stageHint" class="stage-hint" hidden></div>
    </div>
    <div class="transport">
      <span id="time" class="time">0:00 / 0:00</span>
      <button id="undo" class="icon-btn" aria-label="Undo"><i data-icon="undo"></i></button>
      <button id="play" class="play-btn" aria-label="Play"><i data-icon="play"></i></button>
      <button id="redo" class="icon-btn" aria-label="Redo"><i data-icon="redo"></i></button>
      <span class="spacer"></span>
    </div>
    <div class="timeline-wrap">
      <div id="tl" class="tl"><div id="tlInner" class="tl-inner"></div></div>
      <div class="playhead" aria-hidden="true"></div>
    </div>
    <nav id="toolbar" class="toolbar" aria-label="Tools"></nav>
  </section>

  <!-- Bottom sheet for every tool -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-scrim" id="sheetScrim"></div>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-grab"></div>
      <div class="sheet-head"><h3 id="sheetTitle"></h3><button id="sheetDone" class="icon-btn" aria-label="Done"><i data-icon="check"></i></button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>

  <!-- Working on something long -->
  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="busy-logo"><svg class="logo-svg" viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A372F8"/>
            <stop offset=".55" stop-color="#D446EE"/>
            <stop offset="1" stop-color="#F06BBE"/>
          </linearGradient>
          <radialGradient id="shine" cx=".3" cy=".2" r=".6">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b3150"/>
            <stop offset=".5" stop-color="#1c1430"/>
            <stop offset="1" stop-color="#160f26"/>
          </linearGradient>
        </defs>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#tile)"/>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#shine)"/>
        <!-- Blade with the lower point: the top ring's half. -->
        <g class="blade-a">
          <circle cx="245" cy="352" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M300 392 L492 520" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 520 L600 508 L852 635 L505 588 Z" fill="url(#steel)"/>
        </g>
        <!-- Blade with the upper point (and the eye): the bottom ring's half. -->
        <g class="blade-b">
          <circle cx="240" cy="665" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M298 628 L492 510" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 448 L848 318 L600 508 L470 540 Z" fill="url(#steel)"/>
          <g class="eye">
            <circle cx="592" cy="452" r="33" fill="#fff"/>
            <circle cx="600" cy="450" r="14" fill="#160f26"/>
          </g>
        </g>
        <circle cx="480" cy="515" r="24" fill="#E36BE4"/>
      </svg></div>
      <h3 id="busyTitle">Working…</h3>
      <p id="busyText"></p>
      <div class="bar"><div id="busyBar"></div></div>
      <button id="busyCancel" class="btn ghost">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="mediaBox" class="media-box" aria-hidden="true"></div>
  <input type="file" id="pickMedia" accept="video/*,image/*" multiple hidden>
  <input type="file" id="pickAudio" accept="audio/*,video/*" hidden>

  <script src="capacitor.js"></script>
  <script src="shared/version.js"></script>
  <script src="shared/effects.js"></script>
  <script src="shared/captions.js"></script>
  <script src="shared/plans.js"></script>
  <script src="shared/keyframes.js"></script>
  <script src="shared/prompt.js"></script>
  <script src="shared/beats.js"></script>
  <script src="shared/caption-timing.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/media.js"></script>
  <script src="js/model.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/render.js"></script>
  <script src="js/player.js"></script>
  <script src="js/mux.js"></script>
  <script src="js/export.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/autocut.js"></script>
  <script src="js/captions-ai.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
