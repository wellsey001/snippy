<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snippy update splash (source for src/update/update-splash.gif)</title>
<style>
  /* The window shown while an update installs. Drawn as a seamless 2.4-second loop and saved as an
     animated GIF (node scripts/make-update-splash.js), which a small PowerShell window plays. */
  html, body { margin: 0; width: 420px; height: 300px; overflow: hidden; background: #110f17; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .card {
    position: relative; width: 420px; height: 300px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a1840 0%, #15121d 58%, #110f17 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .glow { position: absolute; width: 260px; height: 260px; left: 50%; top: 40%; translate: -50% -50%;
    background: radial-gradient(circle, rgba(217, 70, 239, .42), rgba(217, 70, 239, 0) 65%); filter: blur(6px);
    animation: glow 2.4s ease-in-out infinite; }
  .logo { position: relative; width: 112px; height: 112px; animation: bob 2.4s ease-in-out infinite; }
  .logo svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 22px rgba(168, 85, 247, .45)); }
  .blade-a, .blade-b { transform-origin: 480px 515px; transform-box: view-box; }
  .blade-a { animation: snip-a 2.4s ease-in-out infinite; }
  .blade-b { animation: snip-b 2.4s ease-in-out infinite; }
  .eye { transform-origin: 596px 452px; transform-box: view-box; animation: blink 2.4s ease-in-out infinite; }
  .name { position: relative; font-size: 25px; font-weight: 800; letter-spacing: .3px; margin-top: 6px;
    background: linear-gradient(105deg, #c4b5fd 0%, #f0abfc 25%, #fbcfe8 42%, #ffffff 50%, #fbcfe8 58%, #f0abfc 75%, #c4b5fd 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 2.4s linear infinite; }
  .sub { position: relative; font-size: 13px; color: #a29db8; }
  .track { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255, 255, 255, .06); overflow: hidden; }
  .run { position: absolute; top: 0; bottom: 0; width: 45%; left: -45%;
    background: linear-gradient(90deg, rgba(139, 92, 246, 0), #8b5cf6 30%, #d946ef 60%, #f472b6 85%, rgba(244, 114, 182, 0));
    animation: run 2.4s cubic-bezier(.45, .05, .55, .95) infinite; }
  @keyframes glow { 0%, 100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes snip-a { 0%, 8%, 30%, 52%, 100% { transform: rotate(0); } 19%, 41% { transform: rotate(-15deg); } }
  @keyframes snip-b { 0%, 8%, 30%, 52%, 100% { transform: rotate(0); } 19%, 41% { transform: rotate(15deg); } }
  @keyframes blink { 0%, 66%, 74%, 100% { transform: scaleY(1); } 70% { transform: scaleY(.1); } }
  @keyframes shine { from { background-position: 150% 0; } to { background-position: -150% 0; } }
  @keyframes run { from { left: -45%; } to { left: 100%; } }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="logo">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A372F8"/>
            <stop offset=".55" stop-color="#D446EE"/>
            <stop offset="1" stop-color="#F06BBE"/>
          </linearGradient>
          <radialGradient id="shine" cx=".3" cy=".2" r=".6">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b3150"/>
            <stop offset=".5" stop-color="#1c1430"/>
            <stop offset="1" stop-color="#160f26"/>
          </linearGradient>
        </defs>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#tile)"/>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#shine)"/>
        <!-- Blade with the lower point: the top ring's half. -->
        <g class="blade-a">
          <circle cx="245" cy="352" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M300 392 L492 520" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 520 L600 508 L852 635 L505 588 Z" fill="url(#steel)"/>
        </g>
        <!-- Blade with the upper point (and the eye): the bottom ring's half. -->
        <g class="blade-b">
          <circle cx="240" cy="665" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M298 628 L492 510" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 448 L848 318 L600 508 L470 540 Z" fill="url(#steel)"/>
          <g class="eye">
            <circle cx="592" cy="452" r="33" fill="#fff"/>
            <circle cx="600" cy="450" r="14" fill="#160f26"/>
          </g>
        </g>
        <circle cx="480" cy="515" r="24" fill="#E36BE4"/>
      </svg>
    </div>
    <div class="name">Updating Snippy</div>
    <div class="sub">This only takes a moment. Snippy will open again by itself.</div>
    <div class="track"><div class="run"></div></div>
  </div>
</body>
</html>
