<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Snippy</title>
<style>
  /* The loading screen: the logo pops in, the scissors snip twice, and the name slides up.
     The whole animation lasts 1.8 seconds; the editor opens when it's done (or when it's
     ready, if that takes longer, with the logo gently breathing meanwhile). */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-app-region: drag; }
  body { display: grid; place-items: center; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .card {
    position: relative; width: 420px; height: 300px; border-radius: 26px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #2a1840 0%, #15121d 58%, #110f17 100%);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .07) inset;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    animation: card-in .35s ease-out both;
  }
  .glow {
    position: absolute; width: 260px; height: 260px; left: 50%; top: 44%; translate: -50% -50%;
    background: radial-gradient(circle, rgba(217, 70, 239, .45), rgba(217, 70, 239, 0) 65%);
    filter: blur(6px); opacity: 0; animation: glow 1.8s ease-out .15s both;
  }
  .logo { position: relative; width: 132px; height: 132px; animation: pop .55s cubic-bezier(.3, 1.6, .5, 1) .1s both; }
  .logo svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 22px rgba(168, 85, 247, .45)); }
  .blade-a, .blade-b { transform-origin: 480px 515px; transform-box: view-box; }
  .blade-a { animation: snip-a .7s ease-in-out .62s 1 both; }
  .blade-b { animation: snip-b .7s ease-in-out .62s 1 both; }
  .eye { transform-origin: 596px 452px; transform-box: view-box; animation: blink .22s ease-in-out 1.42s 1 both; }
  .name {
    position: relative; font-size: 34px; font-weight: 800; letter-spacing: .5px; color: #fff;
    /* A bright band of light sweeps across the name, with a quick glow, as it lands. */
    background: linear-gradient(105deg, #c4b5fd 0%, #f0abfc 18%, #f9a8d4 33%, #fbcfe8 42%, #ffffff 48%, #ffffff 52%, #fbcfe8 58%, #f0abfc 76%, #f9a8d4 100%);
    background-size: 300% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rise .5s cubic-bezier(.2, .9, .3, 1) .85s both, shine .75s cubic-bezier(.45, .05, .25, 1) 1.02s both, flash .75s ease-out 1.02s both;
  }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: linear-gradient(90deg, #8b5cf6, #d946ef, #f472b6); transform-origin: left; animation: load 1.8s cubic-bezier(.4, .1, .3, 1) both; }
  /* Still loading after the animation: the logo breathes until the editor is ready. */
  body.waiting .logo { animation: breathe 1.4s ease-in-out infinite; }
  body.leaving .card { animation: card-out .18s ease-in both; }

  @keyframes card-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes card-out { to { opacity: 0; transform: scale(1.02); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.45) rotate(-14deg); } 100% { opacity: 1; transform: none; } }
  @keyframes glow { 0% { opacity: 0; transform: scale(.6); } 45% { opacity: 1; } 100% { opacity: .55; transform: scale(1); } }
  /* Two quick snips: close, open, close, open. */
  @keyframes snip-a { 0%, 50%, 100% { transform: rotate(0); } 25%, 75% { transform: rotate(-15deg); } }
  @keyframes snip-b { 0%, 50%, 100% { transform: rotate(0); } 25%, 75% { transform: rotate(15deg); } }
  @keyframes blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0% 0; } }
  @keyframes flash {
    0% { filter: drop-shadow(0 0 0 rgba(240, 171, 252, 0)); }
    35% { filter: drop-shadow(0 0 14px rgba(240, 171, 252, .95)) brightness(1.25); }
    100% { filter: drop-shadow(0 0 4px rgba(240, 171, 252, .25)); }
  }
  @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
  <div class="card" role="img" aria-label="Snippy is starting">
    <div class="glow"></div>
    <div class="logo">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs>
          <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#A372F8"/>
            <stop offset=".55" stop-color="#D446EE"/>
            <stop offset="1" stop-color="#F06BBE"/>
          </linearGradient>
          <radialGradient id="shine" cx=".3" cy=".2" r=".6">
            <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3b3150"/>
            <stop offset=".5" stop-color="#1c1430"/>
            <stop offset="1" stop-color="#160f26"/>
          </linearGradient>
        </defs>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#tile)"/>
        <rect x="40" y="40" width="944" height="944" rx="200" fill="url(#shine)"/>
        <!-- Blade with the lower point: the top ring's half. -->
        <g class="blade-a">
          <circle cx="245" cy="352" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M300 392 L492 520" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 520 L600 508 L852 635 L505 588 Z" fill="url(#steel)"/>
        </g>
        <!-- Blade with the upper point (and the eye): the bottom ring's half. -->
        <g class="blade-b">
          <circle cx="240" cy="665" r="86" fill="none" stroke="url(#steel)" stroke-width="50"/>
          <path d="M298 628 L492 510" stroke="url(#steel)" stroke-width="54" stroke-linecap="round"/>
          <path d="M468 448 L848 318 L600 508 L470 540 Z" fill="url(#steel)"/>
          <g class="eye">
            <circle cx="592" cy="452" r="33" fill="#fff"/>
            <circle cx="600" cy="450" r="14" fill="#160f26"/>
          </g>
        </g>
        <circle cx="480" cy="515" r="24" fill="#E36BE4"/>
      </svg>
    </div>
    <div class="name">Snippy</div>
    <div class="bar"></div>
  </div>
  <script>
    // After the animation, keep breathing until the editor shows (the main process closes this window).
    setTimeout(() => document.body.classList.add('waiting'), 1900);
  </script>
</body>
</html>
