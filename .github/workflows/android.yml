# Builds the Android app (an .apk you can install on your phone) on GitHub's own computers.
# Runs by itself with each release (see release.yml), or from the Actions tab
# ("Android app" > "Run workflow") for a test build, which goes on the "android-preview" release.
#
# Signing: Android only installs an update over an app signed with the same key. Add two
# repository secrets (Settings > Secrets and variables > Actions) so every build uses your key:
#   ANDROID_KEYSTORE           the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (the key inside is called "snippy")
# Without them the app is signed with a throwaway key, and each new build must replace the old
# app (uninstall it first) instead of updating it.
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [android-ci]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build the app
        id: build
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          (
            set -ex
            version=$(node -p "require('./package.json').version")
            node mobile/scripts/sync-shared.js
            cd mobile
            npm install --no-audit --no-fund
            cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
            npx cap add android
            node scripts/android-setup.js
            npx cap sync android
            cd android
            chmod +x gradlew
            if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
              echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/snippy.keystore"
              ./gradlew assembleRelease --no-daemon --stacktrace \
                -Pandroid.injected.signing.store.file="$RUNNER_TEMP/snippy.keystore" \
                -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
                -Pandroid.injected.signing.key.alias=snippy \
                -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
              apk=app/build/outputs/apk/release/app-release.apk
            else
              echo "No signing key set up: signing with a throwaway key."
              ./gradlew assembleDebug --no-daemon --stacktrace
              apk=app/build/outputs/apk/debug/app-debug.apk
            fi
            mkdir -p "$GITHUB_WORKSPACE/out"
            cp "$apk" "$GITHUB_WORKSPACE/out/Snippy-$version.apk"
            echo "apk=out/Snippy-$version.apk" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          ) 2>&1 | tee "$RUNNER_TEMP/build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: snippy-android
          path: out/*.apk

      - name: Add it to the release
        if: inputs.release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ steps.build.outputs.version }}" "${{ steps.build.outputs.apk }}" --clobber

      - name: Put a test build on the android-preview release
        if: ${{ !inputs.release }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view android-preview > /dev/null 2>&1; then
            gh release create android-preview --prerelease --title "Snippy for Android (test build)" \
              --notes "The latest test build of Snippy for Android. Download the .apk on your phone and open it to install." --latest=false
          fi
          gh release upload android-preview "${{ steps.build.outputs.apk }}" --clobber

      # The build log goes on the ci-logs branch, so problems can be looked into without signing in.
      - name: Keep the build log
        if: always()
        shell: bash
        run: |
          cp "$RUNNER_TEMP/build.log" /tmp/android-build.log 2>/dev/null || echo "no log" > /tmp/android-build.log
          tail -c 200000 /tmp/android-build.log > /tmp/android-build-tail.log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rf --quiet . > /dev/null 2>&1 || true
          cp /tmp/android-build-tail.log android-build.log
          echo "${{ job.status }} $(date -u +%FT%TZ) ${{ github.sha }}" > android-status.txt
          git add android-build.log android-status.txt
          git commit -m "Android build log" || true
          git push -f origin ci-logs || true
